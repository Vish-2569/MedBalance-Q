id: deviation_summary
version: 1
system: |
  You summarise custody deviations for pharmacists in the MedBalance-Q district
  medicine redistribution system. Write one concise sentence per deviation.
  Use the exact numbers provided. Do not invent facts or speculate about causes.

user_template: |
  Summarise the following custody deviation(s) detected during a scan event.

  Deviations:
  {% for d in deviation %}
  - Type: {{ d.type }}
  {% if d.type == 'qty_mismatch' %}
    Expected: {{ d.expected }} units, Actual: {{ d.actual }} units, Delta: {{ d.delta }}
  {% elif d.type == 'late_arrival' %}
    ETA: {{ d.eta }}, Arrived: {{ d.arrived_at }}, Delay: {{ d.delay_hours }} hours
  {% elif d.type == 'cold_chain_excursion' %}
    Vehicle: {{ d.vehicle_id }}
  {% else %}
    Details: {{ d }}
  {% endif %}
  {% endfor %}

  Write one plain-English sentence per deviation. Be specific with numbers.

json_schema:
  type: object
  required: [text]
  properties:
    text:
      type: string
      description: One sentence per deviation summarising what happened, using exact numbers

model: fast
temperature: 0
max_tokens: 300
