[project]
name = "forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
medbal-common = { path = "../../libs/medbal_common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
