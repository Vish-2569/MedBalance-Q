worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream core_api   { server core-api:8001; }
    upstream ingest_ai  { server ingest-ai:8002; }
    upstream genai_svc  { server genai:8003; }
    upstream forecast   { server forecast:8004; }
    upstream optimizer  { server optimizer:8005; }
    upstream coldchain  { server coldchain:8006; }
    upstream sim_ctrl   { server sim-control:8100; }

    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    client_max_body_size 10m;

    server {
        listen 8080;

        location /api/core/events {
            proxy_pass http://core_api/events;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        location /api/core/ {
            proxy_pass http://core_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ingest/ {
            proxy_pass http://ingest_ai/;
            proxy_set_header Host $host;
        }

        location /api/genai/copilot/ {
            proxy_pass http://genai_svc/copilot/;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_read_timeout 120s;
        }

        location /api/genai/ {
            proxy_pass http://genai_svc/;
            proxy_set_header Host $host;
        }

        location /api/forecast/ {
            proxy_pass http://forecast/;
            proxy_set_header Host $host;
        }

        location /api/optimizer/ {
            proxy_pass http://optimizer/;
            proxy_set_header Host $host;
        }

        location /api/coldchain/ {
            proxy_pass http://coldchain/;
            proxy_set_header Host $host;
        }

        location /api/sim/ {
            proxy_pass http://sim_ctrl/;
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
