[project]
name = "optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "httpx>=0.27",
    "qpiai-opt>=0.0.9",
    "hypothesis>=6.170.13",
    "qpiai-quantum>=0.7.5",
    "ortools>=9.15.6755",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
medbal-common = { path = "../../libs/medbal_common", editable = true }

[tool.pytest.ini_options]
