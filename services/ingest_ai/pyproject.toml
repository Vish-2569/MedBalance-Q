[project]
name = "ingest-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
medbal-common = { path = "../../libs/medbal_common", editable = true }
