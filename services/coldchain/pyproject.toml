[project]
name = "coldchain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["medbal-common", "paho-mqtt>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
medbal-common = { path = "../../libs/medbal_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
