[project]
name = "genai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "google-genai>=1.0.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
medbal-common = { path = "../../libs/medbal_common", editable = true }

[tool.pytest.ini_options]
